# ===================================================================
# TERMINAL AND INPUT
# ===================================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# ===================================================================
# PREFIX AND CONFIG RELOAD
# ===================================================================
set -g prefix C-s

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# ===================================================================
# PANE NAVIGATION AND RESIZING
# ===================================================================
# Pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Pane resizing
bind -n M-h resize-pane -L 3
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3

# ===================================================================
# PANE SPLITTING
# ===================================================================
unbind '"'
bind l split-window -h -p 20
bind h split-window -hb -p 20
unbind '%'
bind j split-window -v -p 20
bind k split-window -vb -p 20
bind-key -n C-` split-window -v -p 20 "$SHELL -ic 'tmux'"

# ===================================================================
# WINDOW AND PANE MANAGEMENT
# ===================================================================
# Prefix + n -> create a new window
unbind n
unbind c
bind n new-window

unbind x
bind c kill-pane

# Ctrl + Tab -> cycle through windows
bind -n C-Tab next-window
bind -n C-BTab previous-window

# ===================================================================
# COPY MODE AND CLIPBOARD
# ===================================================================
setw -g mode-keys vi

# Enter copy mode with Prefix + v instead of Prefix + [
bind v copy-mode

# Start selection with v
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Yank selection with y
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind -T copy-mode-vi MouseDragEnd1Pane

# Allow copied text to reach the system clipboard
set -g set-clipboard on

# ===================================================================
# SESSION LIFECYCLE
# ===================================================================
set-hook -g session-closed 'run-shell "
    session_name=\"#{hook_session_name}\";
    case \"\$session_name\" in
        *-workspace)
            base=\"\${session_name%-workspace}\";
            tmux -L term kill-session -t \"=\${base}-term\" 2>/dev/null || true
            ;;
    esac
"'

# ===================================================================
# COLOR THEME
# ===================================================================
# Monokai Classic-inspired palette
set -g @thm_bg        "#272822"
set -g @thm_fg        "#f8f8f2"
set -g @thm_surface_0 "#3e3d32"
set -g @thm_surface_1 "#49483e"
set -g @thm_surface_2 "#75715e"
set -g @thm_overlay_0 "#75715e"
set -g @thm_overlay_1 "#66d9ef"
set -g @thm_overlay_2 "#9399b2"
set -g @thm_red       "#f92672"
set -g @thm_green     "#a6e22e"
set -g @thm_yellow    "#e6db74"
set -g @thm_blue      "#66d9ef"
set -g @thm_mauve     "#ae81ff"
set -g @thm_peach     "#fd971f"
set -g @thm_lavender  "#66d9ef"
set -g @thm_crust     "#11111b"
set -g @thm_maroon    "#eba0ac"


# Config section
## Window list
set -g @window_text "#{b:pane_current_command}"
set -g @window_text_color "#{@thm_surface_0}"
set -g @window_number_color "#{@thm_overlay_0}"
set -g @window_text_style "#[fg=#{@thm_fg},bg=#{@window_text_color}]"
set -g @window_number_style "#[fg=#{@thm_crust},bg=#{@window_number_color}]"

set -g @window_current_text "#{b:pane_current_command}"
set -g @window_current_text_color "#{@thm_surface_1}"
set -g @window_current_number_color "#{@thm_overlay_1}"
set -g @window_current_text_style "#[fg=#{@thm_fg},bg=#{@window_current_text_color}]"
set -g @window_current_number_style "#[fg=#{@thm_crust},bg=#{@window_current_number_color}]"

set -g @window_number_position "right"
set -g @window_left_separator "#[fg=#{@thm_bg},reverse]#[none]"
set -g @window_middle_separator " "
set -g @window_right_separator "#[fg=#{@thm_bg},reverse]#[none]"

## Right-side status segments
set -gF @status_icon_fg "#{E:@thm_crust}"
set -gF @status_text_fg "#{E:@thm_fg}"
set -gF @status_text_bg "#{E:@thm_surface_0}"
set -g @status_left_separator ""
set -g @status_middle_separator ""
set -g @status_right_separator " "

# Status bar
set -g status on
set -g status-position top
set -g status-justify left
set -gF status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-left ""


# set -g @pane_border_style "fg=#75715E"
# set -g @pane_active_border_style "fg=#A6E22E"

%if "#{==:#{@window_number_position},left}"
  set -gF window-status-format "#{E:@window_number_style}#{E:@window_left_separator}##I"
  set -agF window-status-format "#{E:@window_middle_separator}"
  set -agF window-status-format "#{E:@window_text_style}#{@window_text}#{E:@window_right_separator}"
%else
  set -gF window-status-format "#{E:@window_text_style}#{E:@window_left_separator}#{E:@window_text_style}#{@window_text}"
  set -agF window-status-format "#{E:@window_middle_separator}"
  set -agF window-status-format "#{E:@window_number_style} ##I#{E:@window_right_separator}"
%endif

%if "#{==:#{@window_number_position},left}"
  set -gF window-status-current-format "#{E:@window_current_number_style}#{E:@window_left_separator}##I"
  set -agF window-status-current-format "#{E:@window_middle_separator}"
  set -agF window-status-current-format "#{E:@window_current_text_style}#{@window_current_text}#{@window_current_flags}#{E:@window_right_separator}"
%else
  set -gF window-status-current-format "#{E:@window_current_text_style}#{E:@window_left_separator}#{E:@window_current_text_style}#{@window_current_text}#{@window_current_flags}"
  set -agF window-status-current-format "#{E:@window_middle_separator}"
  set -agF window-status-current-format "#{E:@window_current_number_style} ##I#{E:@window_right_separator}"
%endif

# Application
set -g @application_icon " "
set -gF @application_color "#{E:@thm_maroon}"
set -g @application_text " #{pane_current_command}"

set -gF @status_application "#[fg=#{@application_color}]#{@status_left_separator}"
set -agF @status_application "#[fg=#{@status_icon_fg},bg=#{@application_color}]#{@application_icon}"
set -agF @status_application "#{@status_middle_separator}"
set -agF @status_application "#[fg=#{@status_text_fg},bg=#{@status_text_bg}]"
set -ag @status_application "#{E:@application_text}"
set -agF @status_application "#[fg=#{@status_text_bg}]#{@status_right_separator}"

# Session
set -g @session_icon " "
set -g @session_color "#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}"
set -g @session_text " #S"

set -gF @status_session "#[fg=#{@session_color}]#{@status_left_separator}"
set -agF @status_session "#[fg=#{@status_icon_fg},bg=#{@session_color}]#{@session_icon}"
set -agF @status_session "#{@status_middle_separator}"
set -agF @status_session "#[fg=#{@status_text_fg},bg=#{@status_text_bg}]"
set -ag @status_session "#{E:@session_text}"
set -agF @status_session "#[fg=#{@status_text_bg}]#{@status_right_separator}"

set -g status-right "#{E:@status_application} #{E:@status_session}"

# Messages, menus, popups, and modes
set -gF message-style "fg=#{@thm_overlay_1},bg=#{@thm_overlay_0},align=centre"
set -gF message-command-style "fg=#{@thm_red},bg=#{@thm_overlay_0},align=centre"
set -gF mode-style "bg=#{@thm_surface_0},bold"
set -gF clock-mode-colour "#{@thm_blue}"

%if "#{>=:#{version},3.4}"
  set -gF menu-selected-style "fg=#{@thm_fg},bg=#{@thm_overlay_0},bold"
  set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
  set -gF popup-border-style "fg=#{@thm_surface_1}"
%endif

# ===================================================================
# TMUX PLUGIN MANAGER
# ===================================================================
# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'mrjones2014/smart-splits.nvim'

# ===================================================================
# SMART SPLITS CONFIGURATION
# ===================================================================
# Optional configurations with their default values if omitted:
set -g @smart-splits_no_wrap '' # to disable wrapping. (any value disables wrapping)

set -g @smart-splits_move_left_key  'C-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'C-j' #  --"--
set -g @smart-splits_move_up_key    'C-k' #  --"--
set -g @smart-splits_move_right_key 'C-l' #  --"--

set -g @smart-splits_resize_left_key  'M-h' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'M-j' #  --"--
set -g @smart-splits_resize_up_key    'M-k' #  --"--
set -g @smart-splits_resize_right_key 'M-l' #  --"--

set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.

# ===================================================================
# PLUGIN INITIALIZATION
# ===================================================================
# Keep this line at the very bottom of tmux.conf.
run '~/.config/tmux/plugins/tpm/tpm'
