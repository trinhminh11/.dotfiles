# ===================================================================
# TERMINAL AND INPUT
# ===================================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# ===================================================================
# PREFIX AND CONFIG RELOAD
# ===================================================================
set -g prefix C-s

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# ===================================================================
# PANE NAVIGATION AND RESIZING
# ===================================================================
# Pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Pane resizing
bind -n M-h resize-pane -L 3
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3

# ===================================================================
# PANE SPLITTING
# ===================================================================
bind l split-window -h -p 20
bind h split-window -hb -p 20
bind j split-window -v -p 20
bind k split-window -vb -p 20
bind-key -n C-` split-window -v -p 20 "$SHELL -ic 'tmux'"

# ===================================================================
# WINDOW AND PANE MANAGEMENT
# ===================================================================
# Prefix + n -> create a new window
unbind n
bind n new-window

unbind c
bind c kill-pane

# Ctrl + Tab -> cycle through windows
bind -n C-Tab next-window
bind -n C-BTab previous-window

# ===================================================================
# COPY MODE AND CLIPBOARD
# ===================================================================
setw -g mode-keys vi

# Enter copy mode with Prefix + v instead of Prefix + [
bind v copy-mode

# Start selection with v
bind -T copy-mode-vi v send-keys -X begin-selection

# Yank selection with y
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Allow copied text to reach the system clipboard
set -g set-clipboard on

# ===================================================================
# SESSION LIFECYCLE
# ===================================================================
set-hook -g session-closed 'run-shell "
    session_name=\"#{hook_session_name}\";
    case \"\$session_name\" in
        *-workspace)
            base=\"\${session_name%-workspace}\";
            tmux -L term kill-session -t \"=\${base}-term\" 2>/dev/null || true
            ;;
    esac
"'

# ===================================================================
# TMUX PLUGIN MANAGER
# ===================================================================
# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'mrjones2014/smart-splits.nvim'

# ===================================================================
# SMART SPLITS CONFIGURATION
# ===================================================================
# Optional configurations with their default values if omitted:
set -g @smart-splits_no_wrap '' # to disable wrapping. (any value disables wrapping)

set -g @smart-splits_move_left_key  'C-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'C-j' #  --"--
set -g @smart-splits_move_up_key    'C-k' #  --"--
set -g @smart-splits_move_right_key 'C-l' #  --"--

set -g @smart-splits_resize_left_key  'M-h' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'M-j' #  --"--
set -g @smart-splits_resize_up_key    'M-k' #  --"--
set -g @smart-splits_resize_right_key 'M-l' #  --"--

set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.

# ===================================================================
# COLOR THEME
# ===================================================================
# Monokai Classic-ish palette
set -g @thm_bg         "#272822"
set -g @thm_fg         "#F8F8F2"
set -g @thm_surface_0  "#3E3D32"
set -g @thm_surface_1  "#49483E"
set -g @thm_overlay_0  "#75715E"

set -g @thm_red        "#F92672"
set -g @thm_green      "#A6E22E"
set -g @thm_yellow     "#E6DB74"
set -g @thm_blue       "#66D9EF"
set -g @thm_mauve      "#AE81FF"
set -g @thm_peach      "#FD971F"
set -g @thm_lavender   "#66D9EF"

# Catppuccin window styling
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#{b:pane_current_command}"
set -g @catppuccin_window_current_text "#{b:pane_current_command}"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_background "#272822"

set -g @catppuccin_window_number_color "#75715E"
set -g @catppuccin_window_current_number_color "#66D9EF"

set -g @catppuccin_pane_border_style "fg=#75715E"
set -g @catppuccin_pane_active_border_style "fg=#A6E22E"

# Status bar
set-option -g status-position top
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# ===================================================================
# PLUGIN INITIALIZATION
# ===================================================================
# Keep this line at the very bottom of tmux.conf.
run '~/.config/tmux/plugins/tpm/tpm'
